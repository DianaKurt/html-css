<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Свяжитесь с нами</legend>
                <div class="form-group">
                    <label for="name">Name<span aria-hidden="true">*</span></label>
                        <input 
                        id="name" 
                        type="text"
                        name="name"
                        required
                        placeholder="Введите ваше имя">
                </div>

                <div class="form-group">
                    <label for="email">Email<span aria-hidden="true">*</span></label>
                    <input 
                    id="email" 
                    type="email"
                    name="email"
                    required
                    placeholder="example@domain.com">
                </div>

                <div class="form-group">
                    <label for="direction">Выберите направление</label>
                    <select id="direction" name="direction">
                      <option value="" disabled selected>-- Выберите из списка --</option>
                      <option value="frontend">Frontend-разработка</option>
                      <option value="backend">Backend-разработка</option>
                      <option value="design">UI/UX Дизайн</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message"></label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="4" 
                        placeholder="Напишите ваш вопрос или комментарий..."
                    >
                    </textarea>
                </div>

                <button type="submit">Отправить</button>

            </fieldset>
        </form>
    </main>
</body>
</html>
